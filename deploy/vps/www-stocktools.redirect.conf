# www.stocktools.cc → https://stocktools.cc$request_uri
#
# The frontend workflow (.github/workflows/deploy-vps-frontend.yml) only rsyncs
# dist/ to /var/www/stocktools-frontend and swaps the current symlink. It does
# not install or reload nginx. Copy the ssl_certificate and ssl_certificate_key
# lines from the existing stocktools.cc server block, remove www.stocktools.cc
# from that block's server_name, then install this server and reload nginx.
# Both names must keep TLS so the redirect is not a certificate warning.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.stocktools.cc;

    # ssl_certificate     <same fullchain as stocktools.cc>;
    # ssl_certificate_key <same private key as stocktools.cc>;

    return 301 https://stocktools.cc$request_uri;
}
