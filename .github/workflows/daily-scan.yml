name: Daily US stock scan
on:
  schedule:
    # Normal and 13:00 early closes, in both DST offsets. Only the matching slot scans.
    - cron: '15 18 * * 1-5'
    - cron: '15 19 * * 1-5'
    - cron: '15 21 * * 1-5'
    - cron: '15 22 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['moneytools/**', 'scripts/**', 'watchlist.json', 'requirements.txt', 'requirements-schedule.txt', '.github/workflows/daily-scan.yml']
permissions:
  contents: write
concurrency:
  group: moneytools-daily-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-schedule.txt
      - name: Check exchange session and close time
        id: market
        env:
          SCAN_EVENT: ${{ github.event_name }}
          SCAN_CRON: ${{ github.event.schedule }}
        run: python scripts/market_schedule.py
      - if: steps.market.outputs.run == 'true'
        run: pip install -r requirements.txt
      - if: steps.market.outputs.run == 'true'
        run: python -m unittest discover -s tests -v
      - if: steps.market.outputs.run == 'true'
        run: python scripts/scan.py
      - name: Preserve scan history and publish updated data
        if: steps.market.outputs.run == 'true'
        run: |
          git config user.name "virus11456"
          git config user.email "24470905+virus11456@users.noreply.github.com"
          git add public/data/daily.json public/data/previous.json universe.json universe-meta.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: daily US stock scan"
          git pull --rebase origin main
          git push origin HEAD:main
