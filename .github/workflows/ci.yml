name: Validate analysis and dashboard
on:
  push:
    paths-ignore: ['public/data/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-schedule.txt
      - run: python -m unittest discover -s tests -v
      - run: python deploy/vps/test_scan_vps.py
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --experimental-strip-types tests/market-clock.test.mjs
      - run: node --experimental-strip-types tests/published-snapshot.test.mjs
      - run: node tests/activity-history.test.mjs
      - run: node --experimental-strip-types tests/data-quality.test.mjs
      - run: node --experimental-strip-types tests/analysis-session.test.mjs
      - run: node tests/analysis-comparison.test.mjs
      - run: node --experimental-strip-types tests/condition-progress.test.mjs
      - run: node --experimental-strip-types tests/scan-provenance.test.mjs
      - run: node --experimental-strip-types tests/price-series.test.mjs
      - run: node --experimental-strip-types tests/dashboard-payload.test.mjs
      - run: node --experimental-strip-types tests/overview-summary.test.mjs
      - run: pnpm build
