name: Update US macro data on VPS

on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-us-macro-vps
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install market data dependency
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt
      - name: Build public US macro dataset
        run: python3 scripts/build_us_macro.py
      - name: Install SSH identity
        env:
          DEPLOY_KEY: ${{ secrets.STOCKTOOLS_VPS_DEPLOY_KEY }}
        run: |
          test -n "$DEPLOY_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cp deploy/vps/stocktools-known-hosts ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Publish data without rebuilding the frontend
        run: |
          ssh -o BatchMode=yes stocktools-deploy@72.62.247.218 "mkdir -p /var/www/stocktools-frontend/current/macro-data"
          rsync -az public/macro-data/us-macro.json "stocktools-deploy@72.62.247.218:/var/www/stocktools-frontend/current/macro-data/us-macro.json"
